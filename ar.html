<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        minimum-scale=1.0,
        user-scalable=no">

    <title>AR読み取り</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <!-- GLBアニメーション再生 -->
    <script src="https://unpkg.com/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
        }

        .target {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 180px;
            height: 180px;
            border: 4px dashed #ff9800;
            border-radius: 12px;
            z-index: 998;
            pointer-events: none;
        }

        .ui {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            box-sizing: border-box;
            z-index: 999;
        }

        #spotName {
            margin: 0 0 10px;
            font-size: 28px;
        }

        #message {
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: bold;
        }

        .back {
            display: block;
            background: #2e7d32;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="target"></div>

    <div class="ui">

        <h2 id="spotName">スポット</h2>

        <p id="debug"></p>

        <div id="message">
            マーカーを中央に合わせてください
        </div>

        <a class="back" href="index.html">
            ホームへ戻る
        </a>

    </div>

    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        renderer="antialias: true; precision: medium;"
        arjs="
            sourceType: webcam;
            facingMode: environment;
            debugUIEnabled: false;
        ">

        <!-- move.glb読込 -->
        <a-assets>
            <a-asset-item
                id="moveModel"
                src="models/move.glb">
            </a-asset-item>
        </a-assets>

        <a-entity
            camera
            position="0 0 0">
        </a-entity>

        <!-- app.js が pattern URL を設定 -->
        <a-marker
            id="marker"
            type="pattern"
            url="">

            <!-- GLBモデル -->
            <a-entity
                gltf-model="#moveModel"
                animation-mixer
                position="0 0 0"
                scale="1 1 1"
                rotation="-90 0 0">
            </a-entity>

        </a-marker>

    </a-scene>

    <script>
        const marker = document.querySelector('#marker');
        const message = document.querySelector('#message');

        marker.addEventListener('markerFound', () => {
            message.textContent = 'マーカー検出！';
        });

        marker.addEventListener('markerLost', () => {
            message.textContent = 'マーカーを中央に合わせてください';
        });
    </script>

    <script src="app.js"></script>

</body>

</html>
