<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>謎解き⑥ 温泉</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: sans-serif;
            background: #f5f3f0;
            color: #333;
        }

        header {
            padding: 15px;
            background: white;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        main {
            max-width: 600px;
            margin: auto;
            padding: 15px;
        }

        .instruction {
            background: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .instruction h2 {
            margin-top: 0;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 450px;
            background: #e8e6e3;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid #ccc;
        }

        /* 温泉 */
        #hotSpring {
            position: absolute;

            left: 15%;
            top: 55%;

            width: 70%;
            height: 30%;

            background: #b9dbe5;

            border: 5px solid #91bcc8;

            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 55px;
        }

        /* リトマス試験紙 */
        #litmus {
            position: absolute;

            left: 15%;
            top: 20%;

            width: 110px;
            height: 35px;

            background: #e8b7c6;

            border: 2px solid #777;

            border-radius: 5px;

            cursor: grab;

            touch-action: none;

            z-index: 10;
        }

        #litmus:active {
            cursor: grabbing;
        }

        #label {
            position: absolute;

            top: 8%;

            width: 100%;

            text-align: center;

            font-weight: bold;
        }

        #result {
            margin-top: 15px;

            padding: 15px;

            border-radius: 10px;

            text-align: center;

            font-weight: bold;
        }

        .success {
            background: #e8f5e9;
            color: #2e7d32;
        }

    </style>
</head>

<body>

<header>
    <h1>謎解き⑥</h1>
</header>

<main>

    <div class="instruction">

        <h2>♨️ 温泉のヒント</h2>

        <p>
            🧪 リトマス試験紙を指で動かして、
            温泉に入れてみよう！
        </p>

    </div>


    <div class="stage" id="stage">

        <div id="label">
            🧪 リトマス試験紙を温泉へ！
        </div>


        <!-- リトマス試験紙 -->

        <div id="litmus"></div>


        <!-- 温泉 -->

        <div id="hotSpring">
            ♨️
        </div>

    </div>


    <div id="result"></div>

</main>


<script>

    const stage = document.getElementById("stage");

    const litmus = document.getElementById("litmus");

    const hotSpring = document.getElementById("hotSpring");

    const result = document.getElementById("result");


    let isDragging = false;

    let offsetX = 0;

    let offsetY = 0;



    // ==================================
    // リトマス試験紙を押した
    // ==================================

    litmus.addEventListener("pointerdown", (event) => {

        isDragging = true;

        litmus.setPointerCapture(event.pointerId);


        const rect = litmus.getBoundingClientRect();


        offsetX =
            event.clientX - rect.left;

        offsetY =
            event.clientY - rect.top;

    });



    // ==================================
    // リトマス試験紙を動かしている
    // ==================================

    litmus.addEventListener("pointermove", (event) => {

        if (!isDragging) {
            return;
        }


        const stageRect =
            stage.getBoundingClientRect();


        let x =
            event.clientX
            - stageRect.left
            - offsetX;


        let y =
            event.clientY
            - stageRect.top
            - offsetY;


        // ステージからはみ出さないようにする

        x = Math.max(
            0,
            Math.min(
                x,
                stageRect.width - litmus.offsetWidth
            )
        );


        y = Math.max(
            0,
            Math.min(
                y,
                stageRect.height - litmus.offsetHeight
            )
        );


        litmus.style.left = x + "px";

        litmus.style.top = y + "px";

    });



    // ==================================
    // 指を離した
    // ==================================

    litmus.addEventListener("pointerup", () => {

        if (!isDragging) {
            return;
        }

        isDragging = false;


        checkHotSpring();

    });



    // ==================================
    // 温泉の中に入ったか確認
    // ==================================

    function checkHotSpring() {

        const litmusRect =
            litmus.getBoundingClientRect();


        const springRect =
            hotSpring.getBoundingClientRect();


        // リトマス試験紙の中心

        const centerX =
            litmusRect.left
            + litmusRect.width / 2;


        const centerY =
            litmusRect.top
            + litmusRect.height / 2;


        // 温泉の中に中心が入っているか

        const inside =
            centerX >= springRect.left &&
            centerX <= springRect.right &&
            centerY >= springRect.top &&
            centerY <= springRect.bottom;


        if (inside) {

            // 色を変える

            litmus.style.background =
                "#8faee8";


            // 操作できなくする

            litmus.style.pointerEvents =
                "none";


            // クリア

            result.className =
                "success";


            result.innerHTML =
                `
                🎉 温泉に入った！
                <br>
                リトマス試験紙の色が変化した！
                <br><br>
                💡 ヒント「7」
                `;

        }

    }

</script>

</body>
</html>
