<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no">

    <title>霧を晴らそう</title>


    <!-- =====================
         A-Frame
    ====================== -->

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>


    <!-- =====================
         AR.js
    ====================== -->

    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>


    <style>

        /* =====================
           全体
        ====================== */

        body {

            margin: 0;

            overflow: hidden;

            font-family: sans-serif;

        }


        /* =====================
           ARマーカーの枠
        ====================== */

        .target {

            position: fixed;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            width: 180px;
            height: 180px;

            border: 4px dashed #ff9800;

            border-radius: 12px;

            z-index: 998;

            pointer-events: none;

        }


        /* =====================
           上部メッセージ
        ====================== */

        .ui {

            position: fixed;

            top: 20px;
            left: 50%;

            transform:
                translateX(-50%);

            width: 90%;
            max-width: 400px;

            background:
                rgba(255, 255, 255, 0.95);

            padding: 15px;

            border-radius: 16px;

            text-align: center;

            box-sizing: border-box;

            z-index: 1100;

        }


        .ui h2 {

            margin: 0 0 10px;

        }


        #message {

            margin: 5px 0;

            font-size: 18px;

            font-weight: bold;

        }


        /* =====================
           霧Canvas
        ====================== */

        #mistCanvas {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            z-index: 900;

            /*
             * 最初は操作できない
             */

            pointer-events: none;

        }


        /* =====================
           こする説明
        ====================== */

        #rubMessage {

            display: none;

            position: fixed;

            bottom: 30px;

            left: 50%;

            transform:
                translateX(-50%);

            width: 90%;
            max-width: 400px;

            padding: 15px;

            box-sizing: border-box;

            background:
                rgba(255, 255, 255, 0.95);

            border-radius: 15px;

            text-align: center;

            font-size: 18px;

            font-weight: bold;

            z-index: 1100;

        }


        /* =====================
           発見アイテム
        ====================== */

        #item {

            position: fixed;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%)
                scale(0);

            font-size: 90px;

            z-index: 1150;

            transition:
                transform 0.5s ease;

        }


        #item.show {

            transform:
                translate(-50%, -50%)
                scale(1);

        }


        /* =====================
           クリア画面
        ====================== */

        #clearScreen {

            display: none;

            position: fixed;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            width: 85%;
            max-width: 400px;

            background: white;

            padding: 30px 20px;

            border-radius: 20px;

            text-align: center;

            box-sizing: border-box;

            z-index: 1200;

        }


        #clearScreen h2 {

            font-size: 32px;

            margin: 0 0 15px;

        }


        /* =====================
           ホームへ戻る
        ====================== */

        .back {

            display: block;

            margin-top: 20px;

            padding: 12px;

            background: #2e7d32;

            color: white;

            text-decoration: none;

            border-radius: 8px;

        }

    </style>

</head>


<body>


    <!-- =====================
         ARマーカーの読み取り枠
         
         ※読み取り後は消える
    ====================== -->

    <div class="target"></div>


    <!-- =====================
         メッセージ
    ====================== -->

    <div class="ui">

        <h2>
            🌫️ 霧の中を調べよう
        </h2>

        <p id="message">

            マーカーを読み取ってください

        </p>

    </div>


    <!-- =====================
         霧
         
         Canvasに霧を描く
    ====================== -->

    <canvas id="mistCanvas"></canvas>


    <!-- =====================
         こする説明
    ====================== -->

    <div id="rubMessage">

        👆 指で画面をこすって<br>
        霧を晴らそう！

    </div>


    <!-- =====================
         発見するアイテム
    ====================== -->

    <div id="item">

        🔑

    </div>


    <!-- =====================
         クリア画面
    ====================== -->

    <div id="clearScreen">

        <h2>
            🎉 クリア！
        </h2>

        <p>

            霧の中から<br>
            アイテムを見つけた！

        </p>


        <a
            class="back"
            href="index.html">

            ホームへ戻る

        </a>

    </div>


    <!-- =====================
         AR
    ====================== -->

    <a-scene

        embedded

        vr-mode-ui="enabled: false"

        arjs="
            sourceType: webcam;
            facingMode: environment;
            debugUIEnabled: false;
        ">


        <!-- =====================
             使用するARマーカー
             
             ★ jinja.patt
        ====================== -->

        <a-marker

            id="marker"

            type="pattern"

            url="img/jinja.patt">

        </a-marker>


        <!-- カメラ -->

        <a-entity camera></a-entity>


    </a-scene>


    <script>

        /* ==================================================
           HTML要素を取得
        ================================================== */

        const marker =
            document.getElementById("marker");


        const message =
            document.getElementById("message");


        const target =
            document.querySelector(".target");


        const mistCanvas =
            document.getElementById("mistCanvas");


        const rubMessage =
            document.getElementById("rubMessage");


        const item =
            document.getElementById("item");


        const clearScreen =
            document.getElementById("clearScreen");


        /* ==================================================
           Canvas
        ================================================== */

        const ctx =
            mistCanvas.getContext("2d");


        /* ==================================================
           ゲーム設定
        ================================================== */


        /*
         * 霧の濃さ
         *
         * 0.0 ～ 1.0
         *
         * 数字が大きいほど濃い
         */

        const fogOpacity = 0.92;


        /*
         * 指でこする範囲
         *
         * 数字が大きいほど
         * 一度に広い範囲を消せる
         */

        const brushSize = 90;


        /*
         * 霧を何％消したらクリアするか
         *
         * 65なら
         * 約65％消すとクリア
         */

        const clearPercentage = 65;


        /* ==================================================
           ゲーム状態
        ================================================== */


        /*
         * ARマーカーを読み取ったか
         */

        let started = false;


        /*
         * クリアしたか
         */

        let cleared = false;


        /*
         * 指でこすっているか
         */

        let isDrawing = false;


        /* ==================================================
           Canvasサイズ設定
        ================================================== */

        function resizeCanvas() {

            mistCanvas.width =
                window.innerWidth;

            mistCanvas.height =
                window.innerHeight;

        }


        resizeCanvas();


        /*
         * 画面サイズが変わったとき
         */

        window.addEventListener(
            "resize",
            resizeCanvas
        );


        /* ==================================================
           霧を描く
        ================================================== */

        function drawMist() {


            /*
             * 通常の描画モード
             */

            ctx.globalCompositeOperation =
                "source-over";


            /*
             * 霧の色と濃さ
             */

            ctx.fillStyle =
                `rgba(
                    220,
                    225,
                    230,
                    ${fogOpacity}
                )`;


            /*
             * 画面全体を霧で覆う
             */

            ctx.fillRect(

                0,
                0,

                mistCanvas.width,
                mistCanvas.height

            );

        }


        /* ==================================================
           霧をこすって消す
        ================================================== */

        function eraseMist(x, y) {


            /*
             * destination-out
             *
             * ここが重要。
             *
             * 描いた部分を透明にする。
             */

            ctx.globalCompositeOperation =
                "destination-out";


            ctx.beginPath();


            /*
             * 指の位置を中心に
             * 円形に霧を消す
             */

            ctx.arc(

                x,
                y,

                brushSize / 2,

                0,
                Math.PI * 2

            );


            ctx.fill();

        }


        /* ==================================================
           霧がどれくらい消えたか確認
        ================================================== */

        function checkMist() {


            /*
             * Canvasの画像データを取得
             */

            const imageData =
                ctx.getImageData(

                    0,
                    0,

                    mistCanvas.width,
                    mistCanvas.height

                );


            const data =
                imageData.data;


            let visiblePixels = 0;

            let totalPixels = 0;


            /*
             * 全ピクセルを調べると
             * スマホでは重くなるため、
             * 10ピクセルおきに確認する
             */

            for (
                let i = 3;
                i < data.length;
                i += 4 * 10
            ) {

                totalPixels++;


                /*
                 * alpha値を確認
                 *
                 * 0に近い
                 * ↓
                 * 透明
                 *
                 * 大きい
                 * ↓
                 * 霧が残っている
                 */

                if (data[i] > 20) {

                    visiblePixels++;

                }

            }


            /*
             * 残っている霧の割合
             */

            const remaining =
                (visiblePixels / totalPixels)
                * 100;


            /*
             * 消えた霧の割合
             */

            const clearedPercentage =
                100 - remaining;


            console.log(
                "霧が消えた割合：",
                clearedPercentage.toFixed(1),
                "%"
            );


            /*
             * クリア判定
             */

            if (
                clearedPercentage >=
                clearPercentage
            ) {

                findItem();

            }

        }


        /* ==================================================
           ARマーカーを読み取った
        ================================================== */

        marker.addEventListener(
            "markerFound",
            () => {


                /*
                 * すでにクリア済みなら
                 * ゲームを開始しない
                 */

                if (
                    localStorage.getItem(
                        "mistClear"
                    )
                ) {

                    message.textContent =
                        "✔ クリア済み";

                    return;

                }


                /*
                 * すでに開始しているなら
                 * 何もしない
                 */

                if (started) {

                    return;

                }


                /* =========================================
                   ★ここがゲーム開始
                   
                   ARマーカーは
                   「霧を出すトリガー」
                   としてだけ使用する
                ========================================= */

                started = true;


                /*
                 * マーカーの枠を消す
                 *
                 * ここからは
                 * マーカーを見る必要がない
                 */

                target.style.display =
                    "none";


                /*
                 * メッセージ変更
                 */

                message.textContent =
                    "🌫️ 霧が出てきた！";


                /*
                 * 霧を表示
                 */

                drawMist();


                /*
                 * Canvasを操作可能にする
                 *
                 * これ以降は
                 * ARマーカー不要
                 */

                mistCanvas.style.pointerEvents =
                    "auto";


                /*
                 * こする説明を表示
                 */

                rubMessage.style.display =
                    "block";


                /*
                 * 少し時間を置いて
                 * 説明を変更
                 */

                setTimeout(() => {

                    if (started && !cleared) {

                        message.textContent =
                            "👆 霧をこすって晴らそう！";

                    }

                }, 1500);

            }
        );


        /* ==================================================
           ARマーカーを見失った
           
           ★何もしない
           
           ここが重要！
        ================================================== */

        marker.addEventListener(
            "markerLost",
            () => {


                /*
                 * startedをfalseにしない！
                 *
                 * マーカーは
                 * もう必要ないため。
                 */


                /*
                 * 枠も表示しない
                 */

                target.style.display =
                    "none";

            }
        );


        /* ==================================================
           指を押した
        ================================================== */

        mistCanvas.addEventListener(
            "pointerdown",
            (event) => {


                /*
                 * ゲーム開始前なら
                 * 何もしない
                 */

                if (!started || cleared) {

                    return;

                }


                /*
                 * こすり開始
                 */

                isDrawing = true;


                /*
                 * 押した場所の霧を消す
                 */

                eraseMist(

                    event.clientX,
                    event.clientY

                );

            }
        );


        /* ==================================================
           指を動かした
        ================================================== */

        mistCanvas.addEventListener(
            "pointermove",
            (event) => {


                /*
                 * ゲーム開始前
                 * または
                 * 指を押していない
                 *
                 * 場合は何もしない
                 */

                if (
                    !started ||
                    cleared ||
                    !isDrawing
                ) {

                    return;

                }


                /*
                 * 指の位置の霧を消す
                 */

                eraseMist(

                    event.clientX,
                    event.clientY

                );

            }
        );


        /* ==================================================
           指を離した
        ================================================== */

        mistCanvas.addEventListener(
            "pointerup",
            () => {


                isDrawing = false;


                /*
                 * 霧がどれくらい消えたか確認
                 */

                if (started && !cleared) {

                    checkMist();

                }

            }
        );


        /* ==================================================
           操作キャンセル
        ================================================== */

        mistCanvas.addEventListener(
            "pointercancel",
            () => {

                isDrawing = false;

            }
        );


        /* ==================================================
           アイテム発見
        ================================================== */

        function findItem() {


            /*
             * 二重実行防止
             */

            if (cleared) {

                return;

            }


            cleared = true;

            started = false;


            /*
             * こする説明を消す
             */

            rubMessage.style.display =
                "none";


            /*
             * Canvasを操作できなくする
             */

            mistCanvas.style.pointerEvents =
                "none";


            /*
             * 残っている霧を
             * 完全に消す
             */

            ctx.clearRect(

                0,
                0,

                mistCanvas.width,
                mistCanvas.height

            );


            /*
             * メッセージ
             */

            message.textContent =
                "✨ 何か見つけた！";


            /*
             * 鍵を表示
             */

            item.classList.add(
                "show"
            );


            /*
             * 少し待って
             * クリア画面へ
             */

            setTimeout(() => {

                clearGame();

            }, 1500);

        }


        /* ==================================================
           クリア処理
        ================================================== */

        function clearGame() {


            /*
             * LocalStorageに保存
             *
             * index.htmlから
             * クリア状態を確認できる
             */

            localStorage.setItem(
                "mistClear",
                "clear"
            );


            /*
             * 鍵を消す
             */

            item.classList.remove(
                "show"
            );


            /*
             * クリア画面を表示
             */

            clearScreen.style.display =
                "block";

        }

    </script>


</body>

</html>
