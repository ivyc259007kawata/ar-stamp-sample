<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no">

    <title>霧を晴らそう</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>


    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
        }


        /* =====================
           マーカー枠
        ===================== */

        .target {

            position: fixed;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            width: 180px;
            height: 180px;

            border: 4px dashed #ff9800;

            border-radius: 12px;

            z-index: 998;

            pointer-events: none;
        }


        /* =====================
           上部メッセージ
        ===================== */

        .ui {

            position: fixed;

            top: 20px;
            left: 50%;

            transform:
                translateX(-50%);

            width: 90%;
            max-width: 400px;

            background:
                rgba(255, 255, 255, 0.95);

            padding: 15px;

            border-radius: 16px;

            text-align: center;

            box-sizing: border-box;

            z-index: 1000;
        }


        .ui h2 {
            margin: 0 0 10px;
        }


        #message {

            margin: 5px 0;

            font-size: 18px;

            font-weight: bold;
        }


        /* =====================
           霧
        ===================== */

        #mist {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background:
                rgba(220, 225, 230, 0.95);

            z-index: 900;

            display: none;

            touch-action: none;
        }


        /* =====================
           霧をこすった場所
        ===================== */

        .clear-area {

            position: absolute;

            width: 100px;
            height: 100px;

            border-radius: 50%;

            background: white;

            opacity: 0;

            pointer-events: none;
        }


        /* =====================
           アイテム
        ===================== */

        #item {

            position: fixed;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%) scale(0);

            font-size: 90px;

            z-index: 1050;

            transition:
                transform 0.5s ease;
        }


        #item.show {

            transform:
                translate(-50%, -50%) scale(1);

        }


        /* =====================
           クリア画面
        ===================== */

        #clearScreen {

            display: none;

            position: fixed;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            width: 85%;
            max-width: 400px;

            background: white;

            padding: 30px 20px;

            border-radius: 20px;

            text-align: center;

            box-sizing: border-box;

            z-index: 1100;
        }


        #clearScreen h2 {

            font-size: 32px;

            margin: 0 0 15px;

        }


        .back {

            display: block;

            margin-top: 20px;

            padding: 12px;

            background: #2e7d32;

            color: white;

            text-decoration: none;

            border-radius: 8px;
        }
    </style>

</head>


<body>


    <!-- =====================
         マーカー枠
    ====================== -->

    <div class="target"></div>


    <!-- =====================
         説明
    ====================== -->

    <div class="ui">

        <h2>🌫️ 霧の中を調べよう</h2>

        <p id="message">
            マーカーを読み取ってください
        </p>

    </div>


    <!-- =====================
         霧
    ====================== -->

    <div id="mist"></div>


    <!-- =====================
         アイテム
    ====================== -->

    <div id="item">
        🔑
    </div>


    <!-- =====================
         クリア画面
    ====================== -->

    <div id="clearScreen">

        <h2>🎉 クリア！</h2>

        <p>
            霧の中からアイテムを見つけた！
        </p>

        <a class="back" href="index.html">

            ホームへ戻る

        </a>

    </div>


    <!-- =====================
         AR
    ====================== -->

    <a-scene embedded vr-mode-ui="enabled: false" arjs="
            sourceType: webcam;
            facingMode: environment;
            debugUIEnabled: false;
        ">


        <a-marker id="marker" type="pattern" url="img/jinja.patt">

        </a-marker>


        <a-entity camera></a-entity>

    </a-scene>


    <script>

        // =====================
        // 要素取得
        // =====================

        const marker =
            document.getElementById("marker");

        const message =
            document.getElementById("message");

        const target =
            document.querySelector(".target");

        const mist =
            document.getElementById("mist");

        const item =
            document.getElementById("item");

        const clearScreen =
            document.getElementById("clearScreen");


        // =====================
        // 状態
        // =====================

        let started = false;

        let clearCount = 0;

        const requiredCount = 30;


        // =====================
        // マーカー発見
        // =====================

        marker.addEventListener(
            "markerFound",
            () => {

                if (
                    localStorage.getItem(
                        "mistClear"
                    )
                ) {

                    message.textContent =
                        "✔ クリア済み";

                    return;

                }


                started = true;

                mist.style.display =
                    "block";

                message.textContent =
                    "🌫️ 霧が出てきた！";

                target.style.borderColor =
                    "#4caf50";


                // 少し待ってから
                // 操作説明を変更

                setTimeout(() => {

                    if (started) {

                        message.textContent =
                            "👆 指で霧をこすって晴らそう！";

                    }

                }, 1500);

            }
        );


        // =====================
        // マーカーを見失った
        // =====================

        marker.addEventListener(
            "markerLost",
            () => {

                started = false;

                target.style.borderColor =
                    "#ff9800";

            }
        );


        // =====================
        // 霧をこする
        // =====================

        mist.addEventListener(
            "pointermove",
            (event) => {

                if (!started) {
                    return;
                }


                // 指が押されていない状態では
                // 何もしない

                if (
                    event.buttons !== 1 &&
                    event.pointerType !== "touch"
                ) {
                    return;
                }


                // こすった場所を記録

                const area =
                    document.createElement("div");

                area.className =
                    "clear-area";


                area.style.left =
                    (event.clientX - 50) + "px";

                area.style.top =
                    (event.clientY - 50) + "px";


                mist.appendChild(area);


                clearCount++;


                // =====================
                // 一定量こすったら
                // =====================

                if (
                    clearCount >=
                    requiredCount
                ) {

                    findItem();

                }

            }
        );


        // =====================
        // アイテム発見
        // =====================

        function findItem() {

            started = false;


            // 霧を消す

            mist.style.display =
                "none";


            message.textContent =
                "✨ 何か見つけた！";


            // アイテムを表示

            item.classList.add("show");


            // 少し待ってクリア画面

            setTimeout(() => {

                clearGame();

            }, 1500);

        }


        // =====================
        // クリア
        // =====================

        function clearGame() {

            // LocalStorage保存

            localStorage.setItem(
                "mistClear",
                "clear"
            );


            item.classList.remove(
                "show"
            );


            clearScreen.style.display =
                "block";

        }

    </script>


</body>

</html>
