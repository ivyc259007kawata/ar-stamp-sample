<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no">

    <title>霧を晴らそう</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <style>

        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
        }


        /* =====================
           ARマーカーの枠
        ===================== */

        .target {

            position: fixed;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            width: 180px;
            height: 180px;

            border: 4px dashed #ff9800;

            border-radius: 12px;

            z-index: 998;

            pointer-events: none;
        }


        /* =====================
           上の説明
        ===================== */

        .ui {

            position: fixed;

            top: 20px;
            left: 50%;

            transform:
                translateX(-50%);

            width: 90%;
            max-width: 400px;

            background:
                rgba(255, 255, 255, 0.95);

            padding: 15px;

            border-radius: 16px;

            text-align: center;

            box-sizing: border-box;

            z-index: 1100;
        }


        .ui h2 {

            margin: 0 0 10px;

        }


        #message {

            margin: 5px 0;

            font-size: 18px;

            font-weight: bold;
        }


        /* =====================
           霧
        ===================== */

        #mistCanvas {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            z-index: 900;

            pointer-events: none;
        }


        /* =====================
           アイテム
        ===================== */

        #item {

            position: fixed;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%)
                scale(0);

            font-size: 90px;

            z-index: 1050;

            transition:
                transform 0.5s ease;
        }


        #item.show {

            transform:
                translate(-50%, -50%)
                scale(1);
        }


        /* =====================
           クリア画面
        ===================== */

        #clearScreen {

            display: none;

            position: fixed;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            width: 85%;
            max-width: 400px;

            background: white;

            padding: 30px 20px;

            border-radius: 20px;

            text-align: center;

            box-sizing: border-box;

            z-index: 1200;
        }


        #clearScreen h2 {

            font-size: 32px;

            margin: 0 0 15px;
        }


        .back {

            display: block;

            margin-top: 20px;

            padding: 12px;

            background: #2e7d32;

            color: white;

            text-decoration: none;

            border-radius: 8px;
        }


        /* =====================
           こする説明
        ===================== */

        #rubMessage {

            display: none;

            position: fixed;

            bottom: 30px;

            left: 50%;

            transform:
                translateX(-50%);

            width: 90%;
            max-width: 400px;

            padding: 15px;

            box-sizing: border-box;

            background:
                rgba(255, 255, 255, 0.95);

            border-radius: 15px;

            text-align: center;

            font-size: 18px;

            font-weight: bold;

            z-index: 1100;
        }

    </style>

</head>


<body>


    <!-- ARマーカーの枠 -->

    <div class="target"></div>


    <!-- 上部メッセージ -->

    <div class="ui">

        <h2>
            🌫️ 霧の中を調べよう
        </h2>

        <p id="message">
            マーカーを読み取ってください
        </p>

    </div>


    <!-- =====================
         霧を描くCanvas
    ===================== -->

    <canvas id="mistCanvas"></canvas>


    <!-- こする説明 -->

    <div id="rubMessage">

        👆 指で画面をこすって<br>
        霧を晴らそう！

    </div>


    <!-- =====================
         発見アイテム
    ===================== -->

    <div id="item">
        🔑
    </div>


    <!-- =====================
         クリア画面
    ===================== -->

    <div id="clearScreen">

        <h2>
            🎉 クリア！
        </h2>

        <p>
            霧の中から<br>
            アイテムを見つけた！
        </p>

        <a
            class="back"
            href="index.html">

            ホームへ戻る

        </a>

    </div>


    <!-- =====================
         AR
    ===================== -->

    <a-scene

        embedded

        vr-mode-ui="enabled: false"

        arjs="
            sourceType: webcam;
            facingMode: environment;
            debugUIEnabled: false;
        ">


        <a-marker

            id="marker"

            type="pattern"

            url="img/jinja.patt">

        </a-marker>


        <a-entity camera></a-entity>


    </a-scene>


    <script>

        /* =====================
           HTML取得
        ===================== */

        const marker =
            document.getElementById("marker");

        const message =
            document.getElementById("message");

        const target =
            document.querySelector(".target");

        const mistCanvas =
            document.getElementById("mistCanvas");

        const rubMessage =
            document.getElementById("rubMessage");

        const item =
            document.getElementById("item");

        const clearScreen =
            document.getElementById("clearScreen");


        /* =====================
           Canvas準備
        ===================== */

        const ctx =
            mistCanvas.getContext("2d");


        /* =====================
           設定
        ===================== */

        // 霧の濃さ
        const fogOpacity = 0.92;


        // こするブラシの大きさ
        const brushSize = 90;


        // 霧を何％消したらクリアするか
        const clearPercentage = 65;


        let started = false;

        let cleared = false;


        /* =====================
           Canvasサイズ調整
        ===================== */

        function resizeCanvas() {

            mistCanvas.width =
                window.innerWidth;

            mistCanvas.height =
                window.innerHeight;

        }


        resizeCanvas();


        window.addEventListener(
            "resize",
            resizeCanvas
        );


        /* =====================
           霧を描く
        ===================== */

        function drawMist() {

            ctx.globalCompositeOperation =
                "source-over";


            ctx.fillStyle =
                `rgba(
                    220,
                    225,
                    230,
                    ${fogOpacity}
                )`;


            ctx.fillRect(

                0,
                0,

                mistCanvas.width,
                mistCanvas.height

            );

        }


        /* =====================
           霧を消す
        ===================== */

        function eraseMist(x, y) {

            ctx.globalCompositeOperation =
                "destination-out";


            ctx.beginPath();


            ctx.arc(

                x,
                y,

                brushSize / 2,

                0,
                Math.PI * 2

            );


            ctx.fill();

        }


        /* =====================
           霧がどれくらい残っているか
        ===================== */

        function checkMist() {

            /*
             * Canvasの画像データを取得
             */

            const imageData =
                ctx.getImageData(

                    0,
                    0,

                    mistCanvas.width,
                    mistCanvas.height

                );


            const data =
                imageData.data;


            let visiblePixels = 0;

            let totalPixels = 0;


            /*
             * 全ピクセルを確認
             *
             * ただしスマホで重くならないように
             * 10ピクセルおきに確認
             */

            for (
                let i = 3;
                i < data.length;
                i += 4 * 10
            ) {

                totalPixels++;


                /*
                 * alpha値
                 *
                 * 0なら透明
                 */

                if (data[i] > 20) {

                    visiblePixels++;

                }

            }


            /*
             * 霧が残っている割合
             */

            const remaining =
                (visiblePixels / totalPixels)
                * 100;


            /*
             * 消えた割合
             */

            const clearedPercentage =
                100 - remaining;


            /*
             * クリア判定
             */

            if (
                clearedPercentage >=
                clearPercentage
            ) {

                findItem();

            }

        }


        /* =====================
           マーカー発見
        ===================== */

        marker.addEventListener(
            "markerFound",
            () => {


                if (
                    localStorage.getItem(
                        "mistClear"
                    )
                ) {

                    message.textContent =
                        "✔ クリア済み";

                    return;

                }


                if (cleared) {

                    return;

                }


                started = true;


                target.style.borderColor =
                    "#4caf50";


                message.textContent =
                    "🌫️ 霧が出てきた！";


                drawMist();


                /*
                 * こする説明を表示
                 */

                rubMessage.style.display =
                    "block";


            }
        );


        /* =====================
           マーカーを見失った
        ===================== */

        marker.addEventListener(
            "markerLost",
            () => {

                /*
                 * ここではゲームを
                 * リセットしない
                 */

                target.style.borderColor =
                    "#ff9800";

            }
        );


        /* =====================
           指でこする
        ===================== */

        let isDrawing = false;


        mistCanvas.addEventListener(
            "pointerdown",
            (event) => {

                if (!started) {

                    return;

                }


                isDrawing = true;


                eraseMist(

                    event.clientX,
                    event.clientY

                );

            }
        );


        mistCanvas.addEventListener(
            "pointermove",
            (event) => {

                if (
                    !started ||
                    !isDrawing
                ) {

                    return;

                }


                eraseMist(

                    event.clientX,
                    event.clientY

                );

            }
        );


        mistCanvas.addEventListener(
            "pointerup",
            () => {

                isDrawing = false;

                checkMist();

            }
        );


        mistCanvas.addEventListener(
            "pointercancel",
            () => {

                isDrawing = false;

            }
        );


        /* =====================
           アイテム発見
        ===================== */

        function findItem() {

            if (cleared) {

                return;

            }


            cleared = true;

            started = false;


            rubMessage.style.display =
                "none";


            /*
             * 霧を完全に消す
             */

            ctx.clearRect(

                0,
                0,

                mistCanvas.width,
                mistCanvas.height

            );


            message.textContent =
                "✨ 何か見つけた！";


            /*
             * 鍵を表示
             */

            item.classList.add(
                "show"
            );


            /*
             * 少し待ってクリア
             */

            setTimeout(() => {

                clearGame();

            }, 1500);

        }


        /* =====================
           クリア
        ===================== */

        function clearGame() {

            /*
             * LocalStorageに保存
             */

            localStorage.setItem(
                "mistClear",
                "clear"
            );


            item.classList.remove(
                "show"
            );


            clearScreen.style.display =
                "block";

        }

    </script>


</body>

</html>
