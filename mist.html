<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no">

    <title>霧を晴らそう</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
        }


        /* =====================
           ARマーカーの枠
        ===================== */

        .target {

            position: fixed;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            width: 180px;
            height: 180px;

            border: 4px dashed #ff9800;

            border-radius: 12px;

            z-index: 998;

            pointer-events: none;
        }


        /* =====================
           上の説明
        ===================== */

        .ui {

            position: fixed;

            top: 20px;
            left: 50%;

            transform:
                translateX(-50%);

            width: 90%;
            max-width: 400px;

            background:
                rgba(255, 255, 255, 0.95);

            padding: 15px;

            border-radius: 16px;

            text-align: center;

            box-sizing: border-box;

            z-index: 1100;
        }


        .ui h2 {

            margin: 0 0 10px;

        }


        #message {

            margin: 5px 0;

            font-size: 18px;

            font-weight: bold;
        }


        /* =====================
           霧
        ===================== */

        #mistCanvas {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            z-index: 900;

            pointer-events: none;
        }


        /* =====================
           アイテム
        ===================== */

        #item {

            position: fixed;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%) scale(0);

            font-size: 90px;

            z-index: 1050;

            transition:
                transform 0.5s ease;
        }


        #item.show {

            transform:
                translate(-50%, -50%) scale(1);
        }


        /* =====================
           クリア画面
        ===================== */

        #clearScreen {

            display: none;

            position: fixed;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            width: 85%;
            max-width: 400px;

            background: white;

            padding: 30px 20px;

            border-radius: 20px;

            text-align: center;

            box-sizing: border-box;

            z-index: 1200;
        }


        #clearScreen h2 {

            font-size: 32px;

            margin: 0 0 15px;
        }


        .back {

            display: block;

            margin-top: 20px;

            padding: 12px;

            background: #2e7d32;

            color: white;

            text-decoration: none;

            border-radius: 8px;
        }


        /* =====================
           こする説明
        ===================== */

        #rubMessage {

            display: none;

            position: fixed;

            bottom: 30px;

            left: 50%;

            transform:
                translateX(-50%);

            width: 90%;
            max-width: 400px;

            padding: 15px;

            box-sizing: border-box;

            background:
                rgba(255, 255, 255, 0.95);

            border-radius: 15px;

            text-align: center;

            font-size: 18px;

            font-weight: bold;

            z-index: 1100;
        }
    </style>

</head>


<body>


    <!-- ARマーカーの枠 -->

    <div class="target"></div>


    <!-- 上部メッセージ -->

    <div class="ui">

        <h2>
            🌫️ 霧の中を調べよう
        </h2>

        <p id="message">
            マーカーを読み取ってください
        </p>

    </div>


    <!-- =====================
         霧を描くCanvas
    ===================== -->

    <canvas id="mistCanvas"></canvas>


    <!-- こする説明 -->

    <div id="rubMessage">

        👆 指で画面をこすって<br>
        霧を晴らそう！

    </div>


    <!-- =====================
         発見アイテム
    ===================== -->

    <div id="item">
        🔑
    </div>


    <!-- =====================
         クリア画面
    ===================== -->

    <div id="clearScreen">

        <h2>
            🎉 クリア！
        </h2>

        <p>
            霧の中から<br>
            アイテムを見つけた！
        </p>

        <a class="back" href="index.html">

            ホームへ戻る

        </a>

    </div>


    <!-- =====================
         AR
    ===================== -->

    <a-scene embedded vr-mode-ui="enabled: false" arjs="
            sourceType: webcam;
            facingMode: environment;
            debugUIEnabled: false;
        ">


        <a-marker id="marker" type="pattern" url="img/jinja.patt">

        </a-marker>


        <a-entity camera></a-entity>


    </a-scene>


    <script>

        /* =====================
           HTML取得
        ===================== */

        const marker =
            document.getElementById("marker");

        const message =
            document.getElementById("message");

        const target =
            document.querySelector(".target");

        const mistCanvas =
            document.getElementById("mistCanvas");

        const rubMessage =
            document.getElementById("rubMessage");

        const item =
            document.getElementById("item");

        const clearScreen =
            document.getElementById("clearScreen");


        /* =====================
           Canvas準備
        ===================== */
